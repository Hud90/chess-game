<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <link rel="stylesheet" href="css/style.css">

    <title>Chess App</title>
</head>

<body>

    <div id="auth-screen">

    <div class="menu">

        <h2>Login</h2>

        <input
            id="username"
            type="text"
            placeholder="Username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="login-btn">
            Login
        </button>

        <button id="register-btn">
            Register
        </button>

    </div>

</div>

<!-- SIDE SELECT (ONLY ONE UI) -->
<div id="start-screen">
    <div class="menu">
        <h2>Chess Setup</h2>

        <label>Stockfish Rating: <span id="level-display">0</span></label>
        <input id="level" type="range" min="0" max="2000" value="0">

        <button onclick="chooseSide('w')">Play White</button>
        <button onclick="chooseSide('b')">Play Black</button>
    </div>
</div>

<!-- GAME OVER SCREEN -->
<div id="game-over" class="hidden">
    <div class="menu">
        <h2 id="game-result">Game Over</h2>

        <button onclick="restartGame()">Play Again</button>
        <button onclick="enterReviewMode()">Review Game</button>
        
    </div>
</div>

<!-- MOVE HISTORY SIDEBAR -->
<div id="game-container">

    <!-- EVAL BAR -->
    <div id="eval-wrapper">
        <div id="eval-score">0.0</div>

        <div id="eval-bar-container">
            <div id="eval-bar"></div>
        </div>
    </div>

    <!-- BOARD AREA -->
    <div id="board-area">

        <div id="black-captures" class="captures"></div>

        <div id="board-wrapper">
            <div id="board"></div>
        </div>

        <div id="white-captures" class="captures"></div>

    </div>

    <!-- MOVE HISTORY -->
    <div id="move-history">

        <div id="move-history-title">Moves</div>

        <div id="moves-list"></div>

        <div id="history-controls">
            <button id="back-btn">◀</button>
            <button id="forward-btn">▶</button>

            <button id="save-game-btn">Save</button>
            <!--<button id="load-last-btn">Load Last</button>-->
            <button id="share-btn">Share</button>
            <button id="export-pgn-btn">Export PGN</button>
            <button id="new-game-btn">New Game</button>
            <button id="hint-btn">Hint</button>
        </div>

        <div id="saved-games-panel">
            <div id="saved-games-title">Saved Games</div>

            <div id="saved-games-list"></div>
        </div>

    </div>

</div>

<!-- promotion UI -->
<div id="promo" class="hidden">
    <div class="promo-box">
        <button data-piece="q">♕</button>
        <button data-piece="r">♖</button>
        <button data-piece="b">♗</button>
        <button data-piece="n">♘</button>
    </div>
</div>

<div id="delete-modal" class="modal hidden">
    <div class="modal-content">
        <p>Are you sure you want to delete this game?</p>

        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="confirm-delete">Delete</button>
            <button id="cancel-delete">Cancel</button>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- chess.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<!-- chessboard.js -->
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script src="js/script.js"></script>

</body>
</html>
